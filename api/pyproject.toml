[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binbrain-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.8",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "python-multipart>=0.0.22",
  "fastembed==0.3.6",
  "ultralytics==8.4.0",
  # F-06/CVE-2026-25990: Pillow 12.1.1 fixes a PSD OOB-write CVE, but fastembed==0.3.6
  # pins Pillow<11.0.0 (the fastembed pin itself is load-bearing — a prior upgrade
  # broke the bge-small embedding harness). Mitigated in-depth by
  # app/services/image_validation.py: the magic-byte allowlist rejects PSD before
  # Image.open() is ever called. Revisit when migrating off fastembed.
  "Pillow>=10.4.0,<11.0.0",
  # HEIF support (iOS depth-map capable). pillow-heif 1.x requires Pillow>=11,
  # so we pin the last 0.x line that supports Pillow 10.
  "pillow-heif>=0.22.0,<1.0.0",
  "aiofiles>=24.1.0",
  "clip @ git+https://github.com/ultralytics/CLIP.git",
  "psutil>=5.9.0",
  "starlette>=0.49.1",
  "requests>=2.33.0",
  "onnx>=1.21.0",
  "openai>=1.30.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "httpx==0.27.2",
  "jsonschema==4.23.0",
  "ruff==0.8.4",
]
scripts = [
  "qrcode[pil]==7.4.2",
  "reportlab==4.2.5",
  "psycopg[binary]==3.2.3",
]

[tool.uv]
# BinBrain targets Python 3.12 on Linux/macOS (see api/Dockerfile: python:3.12-slim).
# Restricting resolution environments to Python 3.12 on Linux/macOS avoids
# fastembed==0.3.6's incompatibilities with onnx>=1.21.0 and Pillow>=12 that
# only surface in Python 3.13+ resolution splits.
environments = [
    "python_full_version >= '3.12' and python_full_version < '3.13' and sys_platform == 'darwin'",
    "python_full_version >= '3.12' and python_full_version < '3.13' and sys_platform == 'linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = [".venv", "migrations"]

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  UP: pyupgrade
# B: flake8-bugbear  SIM: simplify  RUF: ruff-native
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line length — rely on the formatter, don't double-gate
  "B008",   # FastAPI uses Depends() as a default arg on purpose
  "UP007",  # allow Optional[X] alongside X | None until a full sweep
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM", "RUF"]
"app/services/vision.py" = ["E501"]  # long prompt strings

[tool.ruff.format]
quote-style = "double"
