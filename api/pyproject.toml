[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binbrain-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "python-multipart==0.0.12",
  "fastembed==0.3.6",
  "ultralytics>=8.4.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "httpx==0.27.2",
  "jsonschema==4.23.0",
]
scripts = [
  "qrcode[pil]==7.4.2",
  "reportlab==4.2.5",
  "psycopg[binary]==3.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
