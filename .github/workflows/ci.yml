name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: binbrain
          POSTGRES_PASSWORD: claude_dev
          POSTGRES_DB: binbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U binbrain -d binbrain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://binbrain:claude_dev@localhost:5432/binbrain_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync api dependencies (incl. test extra)
        working-directory: api
        run: uv sync --extra test --frozen

      - name: Run pytest
        working-directory: api
        run: uv run pytest tests -q

  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Initial rollout: flip to blocking once baseline violations are cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync api dependencies (incl. test extra)
        working-directory: api
        run: uv sync --extra test --frozen

      - name: ruff check
        working-directory: api
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: api
        run: uv run ruff format --check .

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking backstop: specific CVEs pinned by the load-bearing
    # fastembed==0.3.6 dep are listed explicitly in the pip-audit invocation
    # below so any NEW unrelated CVE still surfaces. Remove continue-on-error
    # once fastembed can be upgraded and the Pillow pin is dropped.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Export requirements from uv.lock
        working-directory: api
        # pip-audit resolves each installed distribution back to PyPI to look
        # up CVEs. VCS installs (e.g. `clip @ git+https://github.com/...`) have
        # no PyPI record, so pip-audit with --strict exits 1 with
        #   "Dependency not found on PyPI and could not be audited: clip (1.0)".
        #
        # Two-step workaround:
        #   1. --no-hashes so pip does not enforce hashed-mode install of the
        #      requirements file (hashed-mode fails on VCS deps that legitimately
        #      cannot be hashed).
        #   2. Strip `@ git+` lines after export so pip-audit only sees PyPI
        #      packages — the only ones it can meaningfully audit. uv.lock
        #      remains the authoritative source of truth for reproducible
        #      installs (including hashes); this file is audit-only.
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt -o /tmp/requirements.txt
          sed -i -e '/ @ git+/d' /tmp/requirements.txt

      - name: Run pip-audit
        # Ignored CVEs are load-bearing pins we cannot upgrade today. Both
        # affect Pillow<11, which fastembed==0.3.6 blocks us from leaving
        # (see api/pyproject.toml for the full rationale and mitigations).
        # When the fastembed pin is dropped, delete these --ignore-vuln lines.
        #   CVE-2026-25990 — PSD OOB write. Mitigated: image_validation.py
        #                    magic-byte allowlist rejects PSD pre-Image.open.
        #   CVE-2026-40192 — pillow CVE fixed in 12.2.0.
        run: |
          uvx pip-audit --requirement /tmp/requirements.txt --strict \
            --ignore-vuln CVE-2026-25990 \
            --ignore-vuln CVE-2026-40192

  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
