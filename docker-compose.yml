services:
  db:
    image: pgvector/pgvector:pg17
    container_name: binbrain_db
    environment:
      POSTGRES_DB: binbrain
      POSTGRES_USER: binbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - binbrain_pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"  # Bind to localhost only — do not expose DB to network
    networks:
      - binbrain
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binbrain -d binbrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: binbrain_api
    environment:
      DATABASE_URL: postgresql+psycopg://binbrain:${POSTGRES_PASSWORD}@db:5432/binbrain
      PHOTO_DIR: /data/photos
      EMBED_MODEL: BAAI/bge-small-en-v1.5
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:2b}
      OLLAMA_MAX_IMAGE_PX: ${OLLAMA_MAX_IMAGE_PX:-1280}
      VISION_BASE_URL: ${VISION_BASE_URL:-http://host.docker.internal:11434/v1}
      VISION_API_KEY: ${VISION_API_KEY:-ollama}
      YOLO_WORLD_CONF: ${YOLO_WORLD_CONF:-0.15}
      # S-01: SUGGEST_MATCH_THRESHOLD is now sourced from the runtime settings
      # store (DB table ``settings``, key ``suggest_match_threshold``) — see
      # POST /settings/suggest-match-threshold. The env var survives as a
      # first-boot fallback only, so a developer can still override at launch
      # by exporting ``SUGGEST_MATCH_THRESHOLD`` before ``docker compose up``;
      # no need to wire it through the compose file.
      # Finding #3: writable model cache/download path owned by the app user.
      # Was defaulting to /models (root-owned, PermissionError). Override with
      # a host path + bind-mount in production to persist weights.
      MODELS_DIR: ${MODELS_DIR:-/app/models}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/photos:/data/photos
      - ./data/logs:/data/logs
      # Detection model weights (shared with host benchmarks). Read-only —
      # the container must not mutate these. Host path is gitignored; fresh
      # checkouts need to populate ./models/ before first /detect call, or
      # ultralytics will auto-download into a non-persistent container path.
      - ./models:/app/models:ro
      # Persist fastembed model cache so container recreations don't redownload
      # the BGE model from HuggingFace. fastembed 0.3.6 hard-codes its cache at
      # /tmp/fastembed_cache/ (no env var override, no constructor arg set in
      # app/deps.py), so the volume MUST be mounted exactly there — mounting it
      # at /home/app/.cache/ leaves fastembed writing to the ephemeral /tmp layer
      # and re-downloading ~45MB on every rebuild.
      - binbrain_cache:/tmp/fastembed_cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - binbrain
    ports:
      - "${API_PORT:-8000}:8000"  # Exposed on all interfaces for LAN access; in production front with a TLS reverse proxy
    restart: unless-stopped

networks:
  binbrain:
    driver: bridge

volumes:
  binbrain_cache:
  binbrain_pgdata:
