services:
  db:
    image: pgvector/pgvector:pg17
    container_name: binbrain_db
    environment:
      POSTGRES_DB: binbrain
      POSTGRES_USER: binbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - binbrain_pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - binbrain
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binbrain -d binbrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: binbrain_api
    environment:
      DATABASE_URL: postgresql+psycopg://binbrain:${POSTGRES_PASSWORD}@db:5432/binbrain
      PHOTO_DIR: /data/photos
      EMBED_MODEL: BAAI/bge-small-en-v1.5
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/photos:/data/photos
      # Persist fastembed model cache so restarts don't redownload
      - binbrain_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - binbrain
    ports:
      - "8000:8000"
    restart: unless-stopped

networks:
  binbrain:
    driver: bridge

volumes:
  binbrain_cache:
  binbrain_pgdata:
